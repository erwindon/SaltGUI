version: 2
updates:
  - package-ecosystem: npm
    assignees:
      - "erwindon"
    directory: "/"
    schedule:
      interval: daily
      time: "04:00"
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    assignees:
      - "erwindon"
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
    open-pull-requests-limit: 10

  - package-ecosystem: docker
    assignees:
      - "erwindon"
    directory: "/docker"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
    open-pull-requests-limit: 10
